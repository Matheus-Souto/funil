# Instalação de produção: app (Next em Node) + Postgres 17 + Caddy (HTTPS automático).
# Guia passo a passo: docs/instalacao.md. Variáveis: copie .env.example para .env e preencha.
#   docker compose up -d --build
# Só o Caddy publica portas (80/443). Postgres e app ficam na rede interna do compose.
name: funil

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MODE: ${MODE:-single}
      BASE_URL: ${BASE_URL:-https://${DOMAIN:?defina DOMAIN no .env}}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
      SECRET: ${SECRET:?defina SECRET no .env (openssl rand -base64 48)}
      # Papel `app` (sem BYPASSRLS, não dono das tabelas): usado pelo app em execução.
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env (openssl rand -hex 24)}@postgres:5432/funil
      # Papel dono (superusuário do Postgres): migrações no início do container e criação de lojas.
      OWNER_DATABASE_URL: postgres://owner:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 24)}@postgres:5432/funil
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DATA_DIR: /data
      # Atrás do Caddy: o IP do comprador é a entrada que o Caddy acrescenta em X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    volumes:
      - app-data:/data
    mem_limit: 512m
    expose:
      - "3000"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 24)}
      POSTGRES_DB: funil
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d funil"]
      interval: 5s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
    volumes:
      # MODE=multi com subdomínios: CADDYFILE=Caddyfile.multi (ver docs/instalacao.md).
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  db-data:
  caddy-data:
  caddy-config:
