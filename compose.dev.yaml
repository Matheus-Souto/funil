name: funil-dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: funil
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - funil-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d funil"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  funil-dev-db:
